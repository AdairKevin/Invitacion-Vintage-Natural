<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitacion Vintage Natural</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="./styles/layout.css">
    <link rel="stylesheet" href="./styles/responsive.css">
    <link rel="stylesheet" href="./styles/style.css">
    <link rel="stylesheet" href="./styles/variables.css">
  </head>
  <body class="center">
    <!-- Todos los textos, fotos y links se editan en contenido.json; aquí solo van variables -->
    <template id="plantilla">
    <div class="content">
      <section class="section-home">
        <div class="home-content">
          <img class="home-img" alt="{{portada.fotoAlt}}" src="{{portada.foto}}">
        </div>
      </section>

      <section class="informacion-principal">
        <div class="titulo">
          <h1>{{titulo.evento}}</h1>
          <h2>{{titulo.nombre}}</h2>
          <p class="frase">{{titulo.frase}}</p>
        </div>
      </section>

      <section class="musica">
        <div class="music-card">
          <div class="album-art"></div>
          <div class="song-title">{{musica.cancion}}</div>
          <div class="artist-name">{{musica.artista}}</div>

          <button class="play-button" id="playPauseBtn">▶</button>

          <div class="progress-container">
            <div class="progress" id="progressBar"></div>
          </div>

          <audio id="audioPlayer" src="{{musica.archivo}}"></audio>
          <!-- Cambia por tu archivo mp3 -->
        </div>
      </section>

      <section class="section-info">
        <div class="overlay-section-info">
          <span></span>
          <span></span>
        </div>
        <div class="box-info">
          <div class="info-primary">
            <h1>{{invitacion.nombre}}</h1>
            <p>{{invitacion.frase}}</p>
          </div>
          <div class="info-secundary">
            {{#invitacion.familia}}
            <div class="info-content">
              <b>{{titulo}}</b>
              <ul>
                <li>{{nombre1}}</li>
                <li>{{nombre2}}</li>
              </ul>
            </div>
            {{/invitacion.familia}}
            
          </div>
          <div class="section-date">
            <div class="date-info center">
              <img width="200" src="{{invitacion.separador}}" alt="{{invitacion.separadorAlt}}">
              <p class="date-text">{{invitacion.fraseFecha}}</p>
            </div>
            <div class="date-box">
              <h2>{{invitacion.dia}}</h2>
              <ul class="center">
                <li>{{invitacion.mes}}</li>
                <li>{{invitacion.diaNumero}}</li>
                <li>{{invitacion.hora}}</li>
              </ul>
            </div>
            <ul class="date-time">
              <li>
                <div class="time_number" id="dias"></div>
                <div class="time_txt">{{invitacion.dias}}</div>
              </li>
              <li>
                <div class="time_number" id="horas"></div>
                <div class="time_txt">{{invitacion.horas}}</div>
              </li>
              <li>
                <div class="time_number" id="minutos"></div>
                <div class="time_txt">{{invitacion.minutos}}</div>
              </li>
              <li>
                <div class="time_number" id="segundos"></div>
                <div class="time_txt">{{invitacion.segundos}}</div>
              </li>
            </ul>
          </div>
        </div>
      </section>

      <section class="section-calendar">
        <div class="calendar-box">
          <div class="calendar-header">
            <span>{{calendario.etiqueta}}</span>
            <h2 id="calendarioMes"></h2>
          </div>

          <div class="calendar-body">
            <div class="week">{{calendario.diasSemana}}</div>

            <div class="days" id="calendarioDias"></div>
          </div>

          <a class="calendar-btn" id="calendarioBoton" href="#" target="_blank">{{calendario.boton}}</a>
        </div>
      </section>

      <section class="section-cronograma">
        <div class="cronograma-container">
          <div class="cronograma-title">
            <h2>{{cronograma.titulo}}</h2>
            <p>{{cronograma.descripcion}}</p>
          </div>

          <div class="timeline">
            {{#cronograma.actividades}}
            <div class="timeline-item">
              <div class="timeline-icon">
                <img src="{{icono}}" alt="{{iconoAlt}}">
              </div>

              <div class="timeline-content">
                <span>{{hora}}</span>
                <h3>{{actividad}}</h3>
                <p>{{descripcion}}</p>
              </div>
            </div>
            {{/cronograma.actividades}}

            

            

            
          </div>
        </div>
      </section>

      <section class="section-place">
        <div class="overlay-section-place">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
        <div class="box-place">
          <div class="place-info center">
            <img width="75" src="{{ceremonia.icono}}" alt="{{ceremonia.iconoAlt}}" fill="#000000">
            <div class="place-txt">
              <h2>{{ceremonia.titulo}}</h2>
              <p>{{ceremonia.lugar}}</p>
            </div>
          </div>
          <a class="place-btn" href="{{ceremonia.mapa}}" target="_blank">{{ceremonia.boton}}</a>
        </div>
      </section>

      <section class="section-place-salon">
        <div class="overlay-section-place">
          <span></span>
          <span></span>
        </div>
        <div class="box-place-salon">
          <div class="place-info center">
            <img width="120" src="{{recepcion.icono}}" alt="{{recepcion.iconoAlt}}">
            <div class="place-txt fiesta">
              <h2>{{recepcion.titulo}}</h2>
              <p>{{recepcion.lugar}}</p>
            </div>
          </div>
          <a class="place-btn" href="{{recepcion.mapa}}" target="_blank">{{recepcion.boton}}</a>
        </div>
      </section>

      <section class="section-galeria">
        <section class="section-info-adicional">
          <div class="info-clothes">
            <img height="70" src="{{infoAdicional.iconoVestimenta}}" alt="{{infoAdicional.iconoVestimentaAlt}}">
            <div class="clothes-txt">
              <h2>{{infoAdicional.vestimentaTitulo}}</h2>
              <p>{{infoAdicional.vestimentaTexto}}</p>
            </div>
          </div>
          <div class="info-separator">
            <img width="200" src="{{infoAdicional.separador}}" alt="{{infoAdicional.separadorAlt}}">
          </div>
          <div class="info-envelope">
            <img width="70" src="{{infoAdicional.iconoRegalos}}" alt="{{infoAdicional.iconoRegalosAlt}}">
            <div class="envelope-txt"></div>
            <h2>{{infoAdicional.regalosTitulo}}</h2>
            <p>{{infoAdicional.regalosTexto}}</p>
          </div>
        </section>
      </section>

      <section class="section-message">
        <div class="overlay-section-message">
          <span></span>
          <span></span>
        </div>
        <div class="box-message">
          <p>{{confirmacion.frase}}</p>
          <b>{{confirmacion.agradecimiento}}</b>
          <button class="confirmar">
            <a href="{{confirmacion.link}}">{{confirmacion.boton}}</a>
          </button>
        </div>
      </section>

      <!-- Footer -->
      <footer>
        {{footer.texto}}
        <a href="{{footer.link}}" target="_blank">{{footer.marca}}</a>
        {{footer.anio}}
      </footer>
    </div>

      <script src="script.js"></script>
    </template>

    <script src="motor.js"></script>
  </body>
</html>
